# 🚀 Enterprise Deployment & Production Configuration

# Multi-environment Docker Compose for Government-Level Deployment
# Supports development, staging, production, and disaster recovery environments

version: '3.9'

networks:
  attendance_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
  
services:
  # =============================================================================
  # DATABASE LAYER - PostgreSQL with High Availability
  # =============================================================================
  
  # Primary Database
  db_primary:
    image: postgres:15-alpine
    container_name: attendance_db_primary
    environment:
      POSTGRES_DB: ${DB_NAME:-attendance_gov}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_REPLICATION_MODE: master
      POSTGRES_REPLICATION_USER: ${DB_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD}
      PGUSER: ${DB_USER:-postgres}
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./config/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./backups:/backups
    ports:
      - "${DB_PRIMARY_PORT:-5432}:5432"
    command: >
      postgres 
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c logging_collector=on
      -c log_destination=stderr
      -c log_directory=/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-attendance_gov}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - attendance_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 2G
          cpus: '1'

  # Read Replica Database (for scaling read operations)
  db_replica:
    image: postgres:15-alpine
    container_name: attendance_db_replica
    environment:
      POSTGRES_DB: ${DB_NAME:-attendance_gov}
      POSTGRES_USER: ${DB_USER:-postgres}  
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_REPLICATION_MODE: slave
      POSTGRES_REPLICATION_USER: ${DB_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD}
      POSTGRES_MASTER_SERVICE: db_primary
      PGUSER: ${DB_USER:-postgres}
    ports:
      - "${DB_REPLICA_PORT:-5433}:5432"
    depends_on:
      db_primary:
        condition: service_healthy
    networks:
      - attendance_network
    restart: unless-stopped
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data

  # =============================================================================
  # CACHE & MESSAGE BROKER LAYER - Redis Cluster
  # =============================================================================
  
  # Redis Master
  redis_master:
    image: redis:7-alpine
    container_name: attendance_redis_master
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_master_data:/data
      - ./config/redis/redis-master.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "${REDIS_MASTER_PORT:-6379}:6379"
    healthcheck:  
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendance_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  # Redis Sentinel for High Availability  
  redis_sentinel:
    image: redis:7-alpine
    container_name: attendance_redis_sentinel
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    volumes:
      - ./config/redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf:ro
    ports:
      - "${REDIS_SENTINEL_PORT:-26379}:26379" 
    depends_on:
      - redis_master
    networks:
      - attendance_network
    restart: unless-stopped

  # =============================================================================
  # APPLICATION LAYER - Django API with Load Balancing
  # =============================================================================
  
  # API Instance 1
  api_1:
    build:
      context: .
      dockerfile: Dockerfile.production
      args:
        ENVIRONMENT: ${ENVIRONMENT:-production}
    container_name: attendance_api_1
    command: >
      sh -c "
        python manage.py wait_for_db &&
        python manage.py migrate --no-input &&
        python manage.py collectstatic --no-input --clear &&
        python manage.py create_default_superuser &&
        python manage.py setup_compliance_frameworks &&
        gunicorn --config /app/gunicorn_config.py config.wsgi:application
      "
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY}
      DJANGO_SETTINGS_MODULE: config.settings.production
      
      # Database Configuration
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-attendance_gov}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db_primary
      DB_PORT: 5432
      DB_READ_HOST: db_replica
      
      # Cache Configuration  
      REDIS_URL: redis://redis_master:6379/0
      REDIS_CACHE_URL: redis://redis_master:6379/1
      REDIS_SESSION_URL: redis://redis_master:6379/2
      
      # Security Configuration
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      
      # Enterprise Features
      ENABLE_MULTI_TENANCY: ${ENABLE_MULTI_TENANCY:-True}
      ENABLE_ENTERPRISE_SECURITY: ${ENABLE_ENTERPRISE_SECURITY:-True}
      ENABLE_COMPLIANCE_MONITORING: ${ENABLE_COMPLIANCE_MONITORING:-True}
      
      # Email Configuration (for notifications)
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      
      # File Storage (AWS S3 for production)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
      
      # Monitoring and Logging
      SENTRY_DSN: ${SENTRY_DSN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
    ports:
      - "8001:8000"
    depends_on:
      db_primary:
        condition: service_healthy
      redis_master:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
      - ./ssl:/app/ssl:ro
    networks:
      - attendance_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  # API Instance 2 (for load balancing)
  api_2:
    build:
      context: .
      dockerfile: Dockerfile.production  
    container_name: attendance_api_2
    command: >
      sh -c "
        python manage.py wait_for_db &&
        gunicorn --config /app/gunicorn_config.py config.wsgi:application
      "
    environment:
      # Same environment as api_1 but without migrations
      <<: *api_environment
    ports:
      - "8002:8000"
    depends_on:
      - api_1
      - db_primary
      - redis_master
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    networks:
      - attendance_network  
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # =============================================================================
  # WEBSOCKET LAYER - ASGI Channels for Real-time Features
  # =============================================================================
  
  websocket:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: attendance_websocket
    command: >
      sh -c "
        python manage.py wait_for_db &&
        daphne -b 0.0.0.0 -p 8000 config.asgi:application
      "
    environment:
      <<: *api_environment
      DJANGO_SETTINGS_MODULE: config.settings.production
    ports:
      - "8003:8000"
    depends_on:
      - db_primary
      - redis_master
    volumes:
      - logs_volume:/app/logs
    networks:
      - attendance_network
    restart: unless-stopped

  # =============================================================================
  # TASK QUEUE - Celery for Background Processing
  # =============================================================================

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: attendance_celery_worker
    command: >
      celery -A config worker 
      --loglevel=info 
      --concurrency=4
      --max-tasks-per-child=1000
      --time-limit=300
      --soft-time-limit=240
    environment:
      <<: *api_environment
    depends_on:
      - db_primary
      - redis_master
    volumes:
      - media_volume:/app/media
      - logs_volume:/app/logs
    networks:
      - attendance_network
    restart: unless-stopped
    deploy:
      replicas: 2

  # Celery Beat (task scheduler)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: attendance_celery_beat
    command: >
      celery -A config beat 
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      <<: *api_environment
    depends_on:
      - db_primary
      - redis_master
    volumes:
      - logs_volume:/app/logs
    networks:
      - attendance_network
    restart: unless-stopped

  # Celery Flower (monitoring)
  celery_flower:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: attendance_celery_flower
    command: >
      celery -A config flower 
      --port=5555
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    environment:
      <<: *api_environment
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      - redis_master
    networks:
      - attendance_network
    restart: unless-stopped

  # =============================================================================
  # REVERSE PROXY & LOAD BALANCER - Nginx with SSL Termination  
  # =============================================================================
  
  nginx:
    image: nginx:alpine
    container_name: attendance_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./ssl/certs:/etc/ssl/certs:ro
      - ./ssl/private:/etc/ssl/private:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api_1
      - api_2  
      - websocket
    networks:
      - attendance_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # =============================================================================
  # MONITORING STACK - Prometheus, Grafana, AlertManager
  # =============================================================================
  
  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: attendance_prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro  
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - attendance_network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: attendance_grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - attendance_network
    depends_on:
      - prometheus
    restart: unless-stopped

  # Node Exporter for system metrics
  node_exporter:
    image: prom/node-exporter:latest
    container_name: attendance_node_exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro  
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - attendance_network
    restart: unless-stopped

  # =============================================================================
  # LOG MANAGEMENT - ELK Stack (Elasticsearch, Logstash, Kibana)
  # =============================================================================

  elasticsearch:
    image: elasticsearch:8.5.0
    container_name: attendance_elasticsearch  
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xmx1g -Xms1g"
      xpack.security.enabled: false
      xpack.security.enrollment.enabled: false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    networks:
      - attendance_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  logstash:
    image: logstash:8.5.0
    container_name: attendance_logstash
    volumes:
      - ./config/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - logs_volume:/app/logs:ro
    ports:
      - "${LOGSTASH_PORT:-5044}:5044"
    environment:
      LS_JAVA_OPTS: "-Xmx512m -Xms512m"
    depends_on:
      - elasticsearch  
    networks:
      - attendance_network
    restart: unless-stopped

  kibana:
    image: kibana:8.5.0
    container_name: attendance_kibana
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - attendance_network
    restart: unless-stopped

  # =============================================================================
  # BACKUP SERVICES
  # =============================================================================
  
  # Database backup service
  db_backup:
    image: postgres:15-alpine
    container_name: attendance_db_backup
    environment:
      POSTGRES_HOST: db_primary
      POSTGRES_DB: ${DB_NAME:-attendance_gov}
      POSTGRES_USER: ${DB_USER:-postgres}  
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BACKUP_BUCKET: ${AWS_S3_BACKUP_BUCKET}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    command: >
      sh -c "
        apk add --no-cache aws-cli &&
        crond -f -d 8
      "
    depends_on:
      db_primary:
        condition: service_healthy
    networks:
      - attendance_network
    restart: unless-stopped

# =============================================================================
# VOLUMES - Persistent Data Storage
# =============================================================================

volumes:
  # Database volumes
  postgres_primary_data:
    driver: local
    driver_opts:
      type: none
      o: bind  
      device: ${DATA_PATH:-./data}/postgres_primary
      
  postgres_replica_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/postgres_replica
      
  # Cache volumes  
  redis_master_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/redis_master
      
  # Application volumes
  static_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/staticfiles
      
  media_volume:
    driver: local
    driver_opts:
      type: none  
      o: bind
      device: ${MEDIA_PATH:-./data}/media
      
  logs_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOGS_PATH:-./logs}
      
  # Monitoring volumes
  prometheus_data:
    driver: local  
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

# =============================================================================
# YAML ANCHORS - Shared Configuration
# =============================================================================

x-api-environment: &api_environment
  DEBUG: ${DEBUG:-False}
  SECRET_KEY: ${SECRET_KEY}
  DJANGO_SETTINGS_MODULE: config.settings.production
  DB_ENGINE: django.db.backends.postgresql
  DB_NAME: ${DB_NAME:-attendance_gov}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_HOST: db_primary
  DB_PORT: 5432
  DB_READ_HOST: db_replica
  REDIS_URL: redis://redis_master:6379/0
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  ENABLE_MULTI_TENANCY: ${ENABLE_MULTI_TENANCY:-True}
  ENABLE_ENTERPRISE_SECURITY: ${ENABLE_ENTERPRISE_SECURITY:-True}