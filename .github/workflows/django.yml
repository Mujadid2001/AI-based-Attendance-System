name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Mirrors the shape of .env. The real secrets are never needed for CI.
      DJANGO_SETTINGS_MODULE: config.settings.development
      DEBUG: 'True'
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef
      ENCRYPTION_KEY: ci_only_fernet_key_aaaaaaaaaaaaaaaaaaaaaa=
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: db.sqlite3
      USE_REDIS: 'False'
      CELERY_TASK_ALWAYS_EAGER: 'True'
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # Only requirements.txt - the heavy ML libraries in
        # requirements-optional.txt need a compiler and are not needed to
        # verify that the app boots.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python attendance_system/manage.py check

      - name: Deployment safety check
        # Fails if DEBUG is on with production settings, or if ALLOWED_HOSTS /
        # CORS_ALLOWED_ORIGINS are empty or wide open.
        run: python attendance_system/manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DEBUG: 'False'
          ALLOWED_HOSTS: ci.example.com
          CORS_ALLOWED_ORIGINS: https://ci.example.com
          CORS_ALLOW_ALL_ORIGINS: 'False'

      - name: No missing migrations
        run: python attendance_system/manage.py makemigrations --check --dry-run

      - name: Migrate
        run: python attendance_system/manage.py migrate --noinput

      - name: Collect static files
        run: python attendance_system/manage.py collectstatic --noinput

      - name: Smoke test the API
        run: |
          python attendance_system/manage.py shell -c "
          from django.test import Client
          from django.test.utils import setup_test_environment
          setup_test_environment()
          c = Client()
          for url in ['/api/', '/api/health/', '/api/auth/', '/api/students/']:
              r = c.get(url)
              assert r.status_code in (200, 401, 403), f'{url} -> {r.status_code}'
              print(f'{url} -> {r.status_code}')
          "
