name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.12.4, 3.11.6]

    steps:
    - uses: actions/checkout@v4    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libboost-all-dev libopenblas-dev liblapack-dev libx11-dev libgtk-3-dev    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --timeout 300 --retries 5 -r requirements.txt
    - name: Run Migrations
      run: |
        cd attendance_system
        python manage.py migrate
    - name: Run Tests
      run: |
        cd attendance_system
        python manage.py test
