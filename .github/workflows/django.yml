name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.12.4, 3.11.6]
        
    env:
      SECRET_KEY: test-secret-key-for-ci
      DEBUG: 'True'
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: db.sqlite3
      DB_USER: ''
      DB_PASSWORD: ''
      DB_HOST: ''
      DB_PORT: ''
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      EMAIL_HOST: ''
      EMAIL_PORT: '587'
      EMAIL_USE_TLS: 'True'
      EMAIL_HOST_USER: ''
      EMAIL_HOST_PASSWORD: ''
      DEFAULT_FROM_EMAIL: noreply@test.com
      
    steps:
    - uses: actions/checkout@v4    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libboost-all-dev libopenblas-dev liblapack-dev libx11-dev libgtk-3-dev libespeak1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --timeout 500 --retries 5 -r requirements.txt
    - name: Run Migrations
      run: |
        cd attendance_system
        python manage.py migrate
    - name: Run Tests
      run: |
        cd attendance_system
        python manage.py test
